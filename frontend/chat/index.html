<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yingo 聊天中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f5f5;--card:#fff;--border:#e0e0e0;--text:#1a1a1a;--text2:#666;--accent:#0078d4;--accent-hover:#106ebe;--danger:#a4262c;--radius:8px;--shadow:0 2px 8px rgba(0,0,0,.06)}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:16px;font-weight:600}
.header .user-info{margin-left:auto;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px}
.container{max-width:960px;margin:0 auto;padding:16px 24px}
.tabs{display:flex;gap:3px;background:var(--card);border-radius:var(--radius);padding:3px;margin-bottom:16px;border:1px solid var(--border);flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--text2);transition:.15s}
.tab:hover{background:#f0f0f0}.tab.active{background:var(--accent);color:#fff}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--text2)}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.row label{font-size:12px;color:var(--text2);min-width:60px}
.row input,.row select{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:5px;font-size:12px;outline:none}
.row input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,120,212,.15)}
button{padding:7px 14px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:500;transition:.15s}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--accent);color:#fff}button.primary:hover{background:var(--accent-hover)}
button.sec{background:#f0f0f0;color:var(--text)}button.sec:hover{background:#e0e0e0}
pre{background:#f5f5f5;border-radius:5px;padding:10px;font-size:11px;overflow-x:auto;max-height:300px}
.msg{background:#f9f9f9;border-radius:6px;padding:10px;margin-bottom:6px;font-size:12px}
.msg .sender{font-weight:600;color:var(--accent);font-size:11px}
.msg .time{float:right;color:var(--text2);font-size:10px}
.msg .text{margin-top:4px;word-break:break-word;line-height:1.5}
code{font-family:monospace;font-size:11px;background:#f5f5f5;padding:1px 4px;border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:7px 10px;border-bottom:2px solid var(--border);color:var(--text2);font-weight:600}
td{padding:7px 10px;border-bottom:1px solid #f0f0f0}
tr:hover td{background:#fafafa}
.empty{text-align:center;padding:30px;color:var(--text2);font-size:13px}
.loading{text-align:center;padding:15px;color:var(--text2);font-size:12px}
.mb{margin-bottom:8px}.mt{margin-top:8px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bg-ok{background:#dff6dd;color:#0e7a0d;padding:1px 7px;border-radius:4px;font-size:11px}
.bg-err{background:#fde7e9;color:#a4262c;padding:1px 7px;border-radius:4px;font-size:11px}
.bg-admin{background:#fff3cd;color:#856404;padding:1px 7px;border-radius:4px;font-size:11px}
.bg-user{background:#e8f4fd;color:#0078d4;padding:1px 7px;border-radius:4px;font-size:11px}
.bg-scope{background:#e8f4fd;color:#0078d4;padding:1px 5px;border-radius:3px;font-size:10px;font-family:monospace}
@media(max-width:768px){.row{flex-direction:column;align-items:stretch}.container{padding:12px}.header{padding:10px 12px}}
</style>
</head>
<body>
<div class="header">
  <h1>Yingo 聊天中心</h1>
  <div class="user-info" id="userInfo" style="display:none">
    <span id="userNameDisplay"></span>
    <span id="userPermDisplay"></span>
    <button class="sec" onclick="app.logout()" style="padding:3px 10px">退出</button>
  </div>
</div>

<div class="container">
  <div id="loginPage" style="max-width:360px;margin:50px auto">
    <div class="card" style="padding:28px">
      <b style="font-size:16px;display:block;text-align:center;margin-bottom:16px">聊天服务登录</b>
      <div class="row"><input id="loginUsername" placeholder="用户名"></div>
      <div class="row"><input id="loginPassword" type="password" placeholder="密码"></div>
      <button class="primary" onclick="app.login()" id="loginBtn" style="width:100%">登录</button>
      <p id="loginError" style="color:#a4262c;font-size:12px;text-align:center;display:none" class="mt"></p>
    </div>
  </div>

  <div id="dashboard" style="display:none">
    <div class="tabs" id="tabBar"></div>
    <div id="pageContainer"></div>
  </div>
</div>

<script src="../config.js"></script>
<script>
(function(){
'use strict';

const USER_API = window.API_CONFIG.userApi;
const CHAT_API = window.API_CONFIG.chatApi;

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
function qs(id) { return document.getElementById(id); }

function fmtTime(ms) {
  if (!ms) return '-';
  const diff = Date.now() - ms, abs = Math.abs(diff), s = Math.floor(abs / 1000);
  if (s < 60) return Math.floor(s) + (diff > 0 ? '秒前' : '秒后');
  if (s < 3600) return Math.floor(s / 60) + (diff > 0 ? '分钟前' : '分钟后');
  if (s < 86400) return Math.floor(s / 3600) + (diff > 0 ? '小时前' : '小时后');
  if (s < 2592000) return Math.floor(s / 86400) + (diff > 0 ? '天前' : '天后');
  return new Date(ms).toLocaleDateString('zh-CN');
}
function badge(type, text) { return '<span class="bg-' + type + '">' + esc(text) + '</span>'; }

class App {
  constructor() {
    this.state = { token: '', perm: '', userId: '', userName: '' };
    this._savedKey = 'fc_state';
    this._currentPage = null;
  }

  init() {
    const saved = this._restore();
    if (saved) { Object.assign(this.state, saved); this.showDashboard(); }
  }

  _restore() {
    try {
      const raw = localStorage.getItem(this._savedKey);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return s.token ? s : null;
    } catch { return null; }
  }
  _save() { localStorage.setItem(this._savedKey, JSON.stringify(this.state)); }
  _clear() { localStorage.removeItem(this._savedKey); }

  async _fetch(api, method, path, body) {
    const h = { 'Content-Type': 'application/json' };
    if (this.state.token) h['Authorization'] = 'Bearer ' + this.state.token;
    const opts = { method, headers: h };
    if (body && method !== 'GET') opts.body = JSON.stringify(body);
    const r = await fetch(api + path, opts);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    return d;
  }

  async login() {
    const u = qs('loginUsername').value.trim(), p = qs('loginPassword').value;
    if (!u || !p) return;
    const btn = qs('loginBtn'); btn.disabled = true; btn.textContent = '登录中...';
    qs('loginError').style.display = 'none';
    try {
      const d = await this._fetch(CHAT_API, 'POST', '/api/v1/login', { username: u, password: p });
      this.state = { token: d.long_token, perm: d.permission, userId: d.user_id, userName: u };
      this._save();
      this.showDashboard();
    } catch (e) {
      qs('loginError').textContent = '登录失败: ' + e.message;
      qs('loginError').style.display = 'block';
    } finally { btn.disabled = false; btn.textContent = '登录'; }
  }

  logout() {
    this._clear();
    this.state = { token: '', perm: '', userId: '', userName: '' };
    qs('loginPage').style.display = 'block';
    qs('dashboard').style.display = 'none';
    qs('userInfo').style.display = 'none';
    if (this._currentPage && this._currentPage.destroy) this._currentPage.destroy();
    this._currentPage = null;
  }

  showDashboard() {
    qs('loginPage').style.display = 'none';
    qs('dashboard').style.display = 'block';
    qs('userNameDisplay').textContent = this.state.userName;
    qs('userPermDisplay').className = this.state.perm === 'admin' ? 'bg-admin' : 'bg-user';
    qs('userPermDisplay').textContent = this.state.perm === 'admin' ? '管理员' : '用户';
    qs('userInfo').style.display = 'flex';
    this._renderTabs();
  }

  _renderTabs() {
    const tabs = [
      { id: 'profile', label: '我的资料' },
      { id: 'rooms', label: '我的房间' },
      { id: 'messages', label: '消息查看' },
    ];
    qs('tabBar').innerHTML = tabs.map((t, i) =>
      '<div class="tab' + (i === 0 ? ' active' : '') + '" data-id="' + t.id + '">' + esc(t.label) + '</div>'
    ).join('');
    $$('.tab').forEach(el => {
      el.onclick = () => {
        $$('.tab').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        this._switchPage(el.dataset.id);
      };
    });
    this._switchPage(tabs[0].id);
  }

  _switchPage(id) {
    if (this._currentPage && this._currentPage.destroy) this._currentPage.destroy();
    const container = qs('pageContainer');
    container.innerHTML = '';
    const pages = {
      'profile': () => new ProfilePage(container),
      'rooms': () => new RoomsPage(container),
      'messages': () => new MessagesPage(container),
    };
    const p = pages[id];
    if (p) { this._currentPage = p(); if (this._currentPage.mount) this._currentPage.mount(); }
  }
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;top:16px;right:16px;z-index:999;padding:10px 16px;border-radius:6px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:opacity .3s;max-width:400px';
  el.style.background = type === 'success' ? '#dff6dd' : '#fde7e9';
  el.style.color = type === 'success' ? '#0e7a0d' : '#a4262c';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
}

function showLoading(container) {
  if (typeof container === 'string') container = qs(container);
  container.innerHTML = '<div class="loading">加载中...</div>';
}

class ProfilePage {
  constructor(container) { this.container = container; }
  mount() {
    this.container.innerHTML = '<div class="card" id="profileCard"><div class="loading">加载中...</div></div>';
    this._load();
  }
  destroy() {}
  async _load() {
    const card = qs('profileCard');
    try {
      const d = await app._fetch(USER_API, 'GET', '/api/v1/users/me');
      const u = d.user;
      card.innerHTML = '<h3>我的资料</h3><table>' +
        '<tr><td style="width:80px">ID</td><td><code>' + esc(u.id) + '</code></td></tr>' +
        '<tr><td>用户名</td><td>' + esc(u.globalName) + '</td></tr>' +
        '<tr><td>权限</td><td>' + badge(u.permission === 'admin' ? 'admin' : 'user', u.permission === 'admin' ? '管理员' : '用户') + '</td></tr>' +
        '<tr><td>在线</td><td>' + (u.online ? badge('ok', '在线') : badge('err', '离线')) + '</td></tr>' +
        '<tr><td>注册时间</td><td>' + new Date(u.createdAt).toLocaleString() + '</td></tr>' +
        '<tr><td>最后在线</td><td>' + (u.lastOnlineAt ? new Date(u.lastOnlineAt).toLocaleString() : '-') + '</td></tr>' +
        '<tr><td>appNames</td><td><code>' + esc(JSON.stringify(u.appNames)) + '</code></td></tr></table>';
    } catch (e) { card.innerHTML = '<h3>我的资料</h3><div class="empty" style="color:#a4262c">' + esc(e.message) + '</div>'; }
  }
}

class RoomsPage {
  constructor(container) { this.container = container; }
  mount() {
    this.container.innerHTML =
      '<div class="card">' +
        '<div class="flex mb"><h3 style="margin:0">创建聊天</h3></div>' +
        '<div class="row"><label>类型</label><select id="roomType" style="flex:1">' +
          '<option value="direct">私聊</option><option value="group">群组</option>' +
        '</select></div>' +
        '<div class="row" id="directUserRow"><label>对方ID</label><input id="directTarget" placeholder="目标用户ID"></div>' +
        '<div class="row" id="groupNameRow" style="display:none"><label>群名称</label><input id="groupName" placeholder="群组名称"></div>' +
        '<div class="row" id="groupMembersRow" style="display:none"><label>成员</label><input id="groupMembers" placeholder="user1,user2,user3" style="font-family:monospace"></div>' +
        '<button class="primary" onclick="app._currentPage._create()" id="createRoomBtn">创建</button>' +
        '<pre id="createRoomResult" class="mt">等待操作...</pre>' +
      '</div>';
    qs('roomType').onchange = () => {
      const v = qs('roomType').value;
      qs('directUserRow').style.display = v === 'direct' ? 'flex' : 'none';
      qs('groupNameRow').style.display = v === 'group' ? 'flex' : 'none';
      qs('groupMembersRow').style.display = v === 'group' ? 'flex' : 'none';
    };
  }
  destroy() {}
  async _create() {
    const type = qs('roomType').value;
    if (type === 'direct') {
      const target = qs('directTarget').value.trim();
      if (!target) { qs('createRoomResult').textContent = '请输入目标用户ID'; return; }
      qs('createRoomResult').textContent = '创建中...';
      try {
        const d = await app._fetch(CHAT_API, 'POST', '/api/v1/rooms/direct', { targetUserId: target });
        qs('createRoomResult').textContent = JSON.stringify(d.room, null, 2);
        toast('私聊创建成功', 'success');
      } catch (e) { qs('createRoomResult').textContent = 'Error: ' + e.message; }
    } else {
      const name = qs('groupName').value.trim();
      const membersStr = qs('groupMembers').value.trim();
      if (!name) { qs('createRoomResult').textContent = '请输入群名称'; return; }
      const memberIds = membersStr ? membersStr.split(',').map(s => s.trim()).filter(Boolean) : [];
      qs('createRoomResult').textContent = '创建中...';
      try {
        const d = await app._fetch(CHAT_API, 'POST', '/api/v1/rooms/group', { name, memberIds });
        qs('createRoomResult').textContent = JSON.stringify(d.room, null, 2);
        toast('群组创建成功', 'success');
      } catch (e) { qs('createRoomResult').textContent = 'Error: ' + e.message; }
    }
  }
}

class MessagesPage {
  constructor(container) { this.container = container; this._cursor = null; this._roomId = ''; }
  mount() {
    this.container.innerHTML =
      '<div class="card">' +
        '<h3>查看消息</h3>' +
        '<div class="row"><label>房间ID</label><input id="msgRoomId" placeholder="房间ID"><button class="primary" onclick="app._currentPage._load()">查看</button></div>' +
        '<div id="msgContent"><div class="empty">输入房间ID后查看消息</div></div>' +
        '<div id="msgMore" style="text-align:center;display:none" class="mt">' +
          '<button class="sec" onclick="app._currentPage._loadMore()">加载更多</button></div>' +
      '</div>';
  }
  destroy() { this._cursor = null; }
  async _load() {
    const roomId = qs('msgRoomId').value.trim();
    if (!roomId) { qs('msgContent').innerHTML = '<div class="empty">请输入房间ID</div>'; return; }
    this._roomId = roomId; this._cursor = null;
    showLoading('msgContent');
    try {
      const d = await app._fetch(CHAT_API, 'GET', '/api/v1/rooms/' + roomId + '/messages?limit=30');
      this._render(d);
    } catch (e) { qs('msgContent').innerHTML = '<div class="empty" style="color:#a4262c">' + esc(e.message) + '</div>'; }
  }
  _render(d) {
    const container = qs('msgContent');
    const items = d.items || [];
    this._cursor = d.cursor;
    qs('msgMore').style.display = d.hasMore ? 'block' : 'none';
    if (!items.length) { container.innerHTML = '<div class="empty">暂无消息</div>'; return; }
    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'max-height:500px;overflow-y:auto';
    items.forEach(m => {
      const div = document.createElement('div'); div.className = 'msg';
      div.innerHTML = '<span class="sender">' + esc(m.senderName || m.senderId) + '</span>' +
        '<span class="time">' + fmtTime(m.sentAt) + '</span>' +
        '<div class="text">' + esc(m.content || '') + '</div>';
      wrapper.appendChild(div);
    });
    container.innerHTML = '';
    container.appendChild(wrapper);
  }
  async _loadMore() {
    if (!this._cursor) return;
    try {
      const d = await app._fetch(CHAT_API, 'GET', '/api/v1/rooms/' + this._roomId + '/messages?cursor=' + this._cursor + '&limit=20');
      const items = d.items || [];
      this._cursor = d.cursor;
      qs('msgMore').style.display = d.hasMore ? 'block' : 'none';
      if (!items.length) return;
      const wrap = qs('msgContent').querySelector('div');
      if (!wrap) return;
      items.forEach(m => {
        const div = document.createElement('div'); div.className = 'msg';
        div.innerHTML = '<span class="sender">' + esc(m.senderName || m.senderId) + '</span>' +
          '<span class="time">' + fmtTime(m.sentAt) + '</span>' +
          '<div class="text">' + esc(m.content || '') + '</div>';
        wrap.appendChild(div);
      });
    } catch (e) { toast(e.message, 'error'); }
  }
}

window.app = new App();
app.init();
})();
</script>
</body>
</html>
