[build]
  publish = "frontend"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Admin-Key"

[[redirects]]
  from = "/user"
  to = "/user/index.html"
  status = 200

[[redirects]]
  from = "/chat"
  to = "/chat/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/user/index.html"
  status = 200
